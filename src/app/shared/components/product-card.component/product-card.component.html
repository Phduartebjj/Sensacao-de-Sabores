<article class="product-card" (click)="onCardClick()">
  <div class="product-image-container">
    <img
      [src]="productImage()"
      [alt]="product().name + ' ' + product().flavor"
      class="product-image"
      loading="lazy"
    />

    @if (product().badge) {
      <span class="product-badge">{{ product().badge }}</span>
    }

    <button
      type="button"
      class="add-to-cart-btn"
      aria-label="Adicionar ao carrinho"
      (click)="onAddToCart($event)"
      title="Adicionar ao carrinho"
    >
      <svg
        class="cart-icon"
        width="14"
        height="14"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M7.496 5.269V3.3393H5.567V2.0529H7.496V0.1232H8.783V2.0529H10.713V3.3393H8.783V5.269H7.496ZM4.015 13.2531C3.763 13.0012 3.637 12.6983 3.637 12.3446C3.637 11.9908 3.763 11.6879 4.015 11.436C4.267 11.1841 4.57 11.0581 4.924 11.0581C5.277 11.0581 5.58 11.1841 5.832 11.436C6.084 11.6879 6.21 11.9908 6.21 12.3446C6.21 12.6983 6.084 13.0012 5.832 13.2531C5.58 13.5051 5.277 13.631 4.924 13.631C4.57 13.631 4.267 13.5051 4.015 13.2531ZM10.447 13.2531C10.195 13.0012 10.069 12.6983 10.069 12.3446C10.069 11.9908 10.195 11.6879 10.447 11.436C10.699 11.1841 11.002 11.0581 11.356 11.0581C11.71 11.0581 12.013 11.1841 12.264 11.436C12.516 11.6879 12.642 11.9908 12.642 12.3446C12.642 12.6983 12.516 13.0012 12.264 13.2531C12.013 13.5051 11.71 13.631 11.356 13.631C11.002 13.631 10.699 13.5051 10.447 13.2531ZM1.064 2.0529V0.7664H3.171L5.904 6.5555H10.407L12.916 2.0529H14.379L11.549 7.1666C11.431 7.381 11.273 7.5471 11.074 7.6651C10.876 7.783 10.659 7.8419 10.423 7.8419H5.631L4.924 9.1284H12.642V10.4149H4.924C4.441 10.4149 4.074 10.2058 3.822 9.7877C3.57 9.3696 3.562 8.9462 3.798 8.5173L4.666 6.9414L2.351 2.0529H1.064Z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>

  <div class="product-info">
    <h3 class="product-name">{{ product().name }}</h3>
    <p class="product-flavor">{{ product().flavor }}</p>
    <div class="product-pricing">
      <span class="current-price">{{ product().price | precoFormatadoPipe}}</span>
      @if (oldPrice()) {
        <span class="old-price">{{ oldPrice() | precoFormatadoPipe}}</span>
      }
    </div>
  </div>
</article>
