<header class="header" aria-label="Cabecalho do site">
  <button class="header__menu" type="button" aria-label="Abrir menu">
    <img src="assets/icons/Hamburguer.svg" alt="Menu" />
  </button>

  <div class="header__title">
    <span>Sensação de Sabores</span>
  </div>

  <button (click)="openCart()" class="header__cart" type="button" aria-label="Carrinho">
    <img src="assets/icons/cart-icon.svg" alt="Carrinho" />
    <span class="header__cart-count">{{ cartItemCount() }}</span>
  </button>

  @if (cartOpen()) {
    <app-cart-drawer (closed)="closeCart()" />
  }
</header>
