<div class="bottom-sheet">
  <div class="sheet-content">
    <section class="sheet-header">
      <button type="button" class="share-button" (click)="shareProduct()" aria-label="Compartilhar">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle
            cx="7"
            cy="12"
            r="2"
            stroke="currentColor"
            stroke-linejoin="round"
            stroke-width="1.5"
          />

          <circle
            cx="17"
            cy="6"
            r="2"
            stroke="currentColor"
            stroke-linejoin="round"
            stroke-width="1.5"
          />

          <path d="M15 7L8.5 11" stroke="currentColor" stroke-width="1.5" />

          <circle
            cx="17"
            cy="18"
            r="2"
            stroke="currentColor"
            stroke-linejoin="round"
            stroke-width="1.5"
          />

          <path d="M8.5 13.5L15 17" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <button type="button" class="close-button" (click)="closed.emit()" aria-label="Fechar">
        ✖
      </button>
    </section>
    <!-- Container da imagem -->
    <div class="image-container">
      <img [src]="product().image" [alt]="product().name" class="product-image" loading="lazy" />
      <div class="image-indicators">
        @for (image of product().image; track image) {
          <span class="indicator"></span>
        }
      </div>
    </div>

    <!-- Informações do produto -->
    <div class="product-info">
      <h2 class="product-name">{{ product().name }}</h2>

      <!-- Badges/Tags -->
      <div class="badge">
        @if (product().badge) {
          {{ product().badge }}
        }
      </div>

      <!-- Preço -->
      <div class="price">
        <span class="price-label">R$</span>
        <span class="price-value">{{ product().price | number: '1.2-2' }}</span>
        <span class="price-unit">UN</span>
      </div>

      <!-- Descrição -->
      <p class="description">{{ product().description }}</p>

      <!-- Quantidade -->
      <div class="quantity-section">
        <span class="quantity-label">Quantidade</span>

        <div class="quantity-control">
          <button type="button" class="quantity-btn decrease" (click)="decreaseQuantity()">
            −
          </button>

          <span class="quantity-number">{{ quantity() }}</span>

          <button type="button" class="quantity-btn increment" (click)="increaseQuantity()">
            +
          </button>
        </div>
      </div>

      <!-- Botões de ação -->
      <div class="actions">
        <button class="btn btn-primary" (click)="addProductToCart()">Adicionar no carrinho</button>
        <button class="btn btn-secondary" (click)="openWhatsApp(product(), quantity())">
          Comprar pelo WhatsApp
        </button>
      </div>
    </div>
  </div>
</div>
