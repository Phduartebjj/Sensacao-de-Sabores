<div class="benefit-badge" [class.benefit-badge--wide]="variant() === 'wide'">
  <a class="badge-link" [href]="link()" [class.badge--wide]="variant() === 'wide'">
    <div class="badge-icon-wrapper">
      <img [src]="icon()" [alt]="title() + ' ' + subtitle()" class="badge-icon" />
    </div>
    <div class="badge-text">
      <span class="badge-title">{{ title() }}</span>
      <span class="badge-subtitle">{{ subtitle() }}</span>
    </div>
  </a>
</div>
