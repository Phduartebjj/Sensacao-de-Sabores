<section class="catalog__section" id="catalog">
  <div class="catalog__header">
    <h2>Conheça <br /><span class="title-emphasis">nossos sabores</span></h2>
  </div>

  <div class="catalog__filters-container">
    <select
      class="catalog__filters"
      [value]="selectedCategory() ?? ''"
      (change)="onCategoryChange($event)"
    >
      <option value="">Todos</option>
      <option value="bolos">Bolos</option>
      <option value="empadas">Empadas</option>
    </select>
  </div>
  <div class="catalog-container">
    @for (product of filteredProducts(); track product.id) {
      <app-product-card [product]="product" (addToCart)="onAddToCart(product)"></app-product-card>
    }
  </div>
</section>
