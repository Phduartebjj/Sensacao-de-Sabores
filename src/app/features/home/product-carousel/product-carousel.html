<section class="product-carousel">
  <div class="product-carousel__header">
    <h2>Conheça <br /><span class="title-emphasis">nossos destaques</span></h2>
  </div>

  <div class="product-carousel__track">
    @for (product of emphasisProducts(); track product.id) {
      <app-product-card
        [product]="product"
        (addToCart)="onAddToCart($event)"
        (cardClick)="openProduct($event)"
      />
    }
  </div>
  @if (selectedProduct()) {
    <app-product-details-sheet [product]="selectedProduct()!" (closed)="closeProduct()" />
  }
</section>
